<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Batmobile Runner</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0c0c1a; color: #d4af37; font-family: 'Courier New', Courier, monospace; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; background: #0c0c1a; }
        #startScreen { position: absolute; text-align: center; }
        h1 { font-size: 4em; margin-bottom: 20px; text-shadow: 2px 2px 4px #000; }
        #startButton { font-size: 1.5em; padding: 10px 20px; background: #d4af37; color: #000; border: 2px solid #000; cursor: pointer; border-radius: 5px; }
        #startButton:hover { background: #fff; }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>BATMOBILE RUNNER</h1>
        <button id="startButton">Start Game</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('startButton');
        const startScreen = document.getElementById('startScreen');
        
        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let gameSpeed = 5;
        let keys = {};
        
        const player = {
            x: 50,
            y: 0,
            width: 80,
            height: 40,
            speed: 7,
            dy: 0,
            gravity: 0.8,
            jumpPower: -15,
            grounded: true,
            hasNitro: false,
            nitroTimer: 0
        };
        
        let obstacles = [];
        let buildings = [];
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height - player.height - 20;
        }

        function spawnObstacle() {
            const height = Math.random() * 50 + 30;
            obstacles.push({
                x: canvas.width,
                y: canvas.height - height - 20,
                width: Math.random() * 30 + 20,
                height: height
            });
        }

        function spawnBuilding() {
            const width = Math.random() * 80 + 50;
            const height = Math.random() * (canvas.height / 2) + 100;
            buildings.push({
                x: canvas.width,
                y: canvas.height - height,
                width: width,
                height: height,
                color: `rgb(${Math.random()*50}, ${Math.random()*50}, ${Math.random()*50 + 50})`
            });
        }
        
        function spawnStar() {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height / 2,
                size: Math.random() * 2,
                opacity: Math.random()
            });
        }

        function update() {
            if (!gameRunning) return;

            // Player movement
            if (keys['a'] || keys['ArrowLeft']) player.x -= player.speed;
            if (keys['d'] || keys['ArrowRight']) player.x += player.speed;
            
            // Nitro speed boost
            if (keys['Shift'] && player.hasNitro) {
                 gameSpeed = 15;
                 player.nitroTimer--;
                 if (player.nitroTimer <= 0) {
                     player.hasNitro = false;
                     gameSpeed = 5; // reset
                 }
            } else {
                 gameSpeed = 5;
            }

            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y > canvas.height - player.height - 20) {
                player.y = canvas.height - player.height - 20;
                player.dy = 0;
                player.grounded = true;
            }

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Move obstacles and check for collisions
            obstacles.forEach((obstacle, index) => {
                obstacle.x -= gameSpeed;
                if (obstacle.x + obstacle.width < 0) {
                    obstacles.splice(index, 1);
                    score++;
                }

                if (
                    player.x < obstacle.x + obstacle.width &&
                    player.x + player.width > obstacle.x &&
                    player.y < obstacle.y + obstacle.height &&
                    player.y + player.height > obstacle.y
                ) {
                    lives--;
                    obstacles.splice(index, 1);
                    if (lives <= 0) {
                        endGame();
                    }
                }
            });

            // Move buildings
            buildings.forEach((building, index) => {
                building.x -= gameSpeed * 0.5; // Parallax effect
                if (building.x + building.width < 0) {
                    buildings.splice(index, 1);
                }
            });

            // Randomly spawn new stuff
            if (Math.random() < 0.02) spawnObstacle();
            if (Math.random() < 0.01) spawnBuilding();

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Stars
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1;

            // Buildings
            buildings.forEach(building => {
                ctx.fillStyle = building.color;
                ctx.fillRect(building.x, building.y, building.width, building.height);
            });

            // Ground
            ctx.fillStyle = '#222';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

            // Player (Batmobile)
            ctx.fillStyle = '#d4af37';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // Cockpit
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x + 10, player.y + 5, player.width - 20, player.height / 3);

            // Obstacles
            ctx.fillStyle = '#ff4444';
            obstacles.forEach(obstacle => {
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            });

            // Score and Lives
            ctx.fillStyle = '#d4af37';
            ctx.font = '20px Courier New';
            ctx.fillText('Score: ' + score, 20, 30);
            ctx.fillText('Lives: ' + '❤️'.repeat(lives), 20, canvas.height - 40);
            
        }

        function handleJump() {
            if (player.grounded) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }
        }
        
        function startGame() {
            gameRunning = true;
            score = 0;
            lives = 3;
            gameSpeed = 5;
            player.x = 50;
            player.y = canvas.height - player.height - 20;
            obstacles = [];
            buildings = [];
            startScreen.style.display = 'none';
            canvas.style.display = 'block';
            update();
        }

        function endGame() {
            gameRunning = false;
            startScreen.style.display = 'block';
            canvas.style.display = 'none';
            startButton.textContent = 'Restart Game';
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('keydown', (e) => { 
            keys[e.key] = true;
            if (e.code === 'Space' || e.key === 'w' || e.key === 'ArrowUp') handleJump();
        });
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        startButton.addEventListener('click', startGame);

        // Initial setup
        for(let i = 0; i < 100; i++) spawnStar();
        resizeCanvas();
        canvas.style.display = 'none';

    </script>
</body>
</html>
